services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmii-balikpapan
    restart: always
    ports:
      - "1960:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-super-secret-key-123}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:1960}
    volumes:
      - ./dev.db:/app/dev.db
      - ./uploads:/app/public/uploads
